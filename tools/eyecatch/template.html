<!DOCTYPE html>
<!-- 記事のアイキャッチ（1200×630）。render.js が #<JSON> を付けて開き、スクリーンショットを撮る。
     見た目はコーポレート（www.agent-best.net/media/ の /images/media/*.png）に揃えている。 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{font-family:"Noto Sans JP","Yu Gothic",sans-serif;color:#fff;position:relative;
    background:linear-gradient(160deg,var(--c1) 0%,var(--c2) 100%)}
  /* 点の地紋と斜線 */
  .dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 1.4px,transparent 1.6px);background-size:46px 46px;background-position:18px 22px}
  .rays{position:absolute;inset:0;background:repeating-linear-gradient(135deg,transparent 0 120px,rgba(255,255,255,.025) 120px 122px);mask-image:linear-gradient(90deg,transparent 45%,#000 100%)}
  .ring{position:absolute;border-radius:50%;border:1.5px solid var(--ac);opacity:.35}
  .r1{width:520px;height:520px;right:-120px;top:-250px}
  .r2{width:600px;height:600px;right:-170px;top:-290px;opacity:.18}
  .left{position:absolute;left:80px;top:90px;width:700px;height:470px;display:flex;flex-direction:column}
  .pill{align-self:flex-start;border:1.5px solid var(--ac);color:var(--ac2);border-radius:999px;padding:6px 22px;font-size:27px;font-weight:400;letter-spacing:.04em;max-width:700px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbox{flex:1;display:flex;align-items:center}
  h1{font-weight:800;line-height:1.38;letter-spacing:.02em;text-shadow:3px 3px 0 rgba(0,0,0,.85)}
  .chips{display:flex;gap:12px;margin-bottom:28px}
  .chips span{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.08);border-radius:999px;padding:5px 18px;font-size:21px;color:rgba(255,255,255,.88)}
  .bar{width:240px;height:5px;border-radius:3px;background:var(--ac)}
  /* 右のウィンドウ */
  .win{position:absolute;left:850px;top:117px;width:270px;height:350px;border:1.5px solid rgba(255,255,255,.28);border-radius:22px;background:rgba(255,255,255,.07)}
  .win .top{position:absolute;left:18px;right:18px;top:18px;height:38px;border-radius:10px;background:rgba(255,255,255,.08)}
  .win .top i{position:absolute;top:13px;width:10px;height:10px;border-radius:50%;background:var(--ac);opacity:.8}
  .ill{position:absolute;left:0;top:0}
  .pager{position:absolute;right:62px;top:538px;display:flex;gap:10px}
  .pager i{width:13px;height:13px;border-radius:50%;background:var(--ac);opacity:.75}
  .pager i:nth-child(2){background:#ccc}
  .brand{position:absolute;right:62px;bottom:38px;font-size:18px;letter-spacing:.12em;color:rgba(255,255,255,.5)}
</style>
</head>
<body>
<div class="dots"></div><div class="rays"></div>
<div class="ring r1"></div><div class="ring r2"></div>
<div class="left">
  <div class="pill" id="pill"></div>
  <div class="tbox"><h1 id="t"></h1></div>
  <div class="chips" id="chips"></div>
  <div class="bar"></div>
</div>
<div class="win"><div class="top"><i style="left:16px"></i><i style="left:40px"></i><i style="left:64px"></i></div>
  <svg class="ill" width="270" height="350" id="ill"></svg></div>
<div class="pager"><i></i><i></i><i></i></div>
<script>
  /* 柱ごとの配色（暗いグラデーション＋差し色）。コーポレートは企業=ブラウン、業界=グレー */
  var THEME={
    offerbox:['#0d2f2e','#1d4d48','#4fc2b0','#9ee6da'],
    wantedly:['#0e1e38','#1f3a66','#5b9bf5','#a9cbff'],
    onecareer:['#2e2110','#5a4120','#d9a24a','#efc985'],
    hikaku:['#17172a','#33334f','#a3a3e0','#d0d0f5'],
    knowhow:['#1f1f1f','#454545','#bdbdbd','#e2e2e2']
  };
  var d=JSON.parse(decodeURIComponent(location.hash.slice(1)));
  var th=THEME[d.pillar]||THEME.hikaku, r=document.documentElement.style;
  r.setProperty('--c1',th[0]);r.setProperty('--c2',th[1]);r.setProperty('--ac',th[2]);r.setProperty('--ac2',th[3]);
  document.getElementById('pill').textContent=d.pill;
  var t=document.getElementById('t');t.textContent=d.title;
  document.getElementById('chips').innerHTML=d.chips.map(function(c){return '<span>'+c.replace(/[<&]/g,'')+'</span>';}).join('');
  /* タイトルは枠（700×約290）に収まるまで文字を小さくする */
  var box=document.querySelector('.tbox');
  for(var fs=60;fs>=36;fs-=2){t.style.fontSize=fs+'px';if(t.scrollWidth<=700&&t.offsetHeight<=box.clientHeight)break;}
  /* 右の図。柱で変える（運用＝伸びるグラフ、比較＝並んだ柱、ノウハウ＝チェックリスト） */
  var ac=th[2], svg='';
  if(d.pillar==='hikaku'){
    [[40,120],[110,190],[180,90]].forEach(function(b,i){svg+='<rect x="'+(b[0])+'" y="'+(310-b[1])+'" width="50" height="'+b[1]+'" rx="6" fill="'+ac+'" opacity="'+(.35+i*.15)+'"/>';});
    svg+='<path d="M30 318 H240" stroke="'+ac+'" stroke-width="3" opacity=".6"/><circle cx="135" cy="105" r="14" fill="none" stroke="'+ac+'" stroke-width="4"/><path d="M128 105 l5 6 l10 -12" stroke="'+ac+'" stroke-width="4" fill="none" stroke-linecap="round"/>';
  }else if(d.pillar==='knowhow'){
    [100,165,230].forEach(function(y,i){svg+='<rect x="38" y="'+(y-16)+'" width="32" height="32" rx="7" fill="none" stroke="'+ac+'" stroke-width="3" opacity=".8"/>'+(i<2?'<path d="M45 '+y+' l7 8 l13 -16" stroke="'+ac+'" stroke-width="4" fill="none" stroke-linecap="round"/>':'')+'<rect x="88" y="'+(y-7)+'" width="'+(140-i*25)+'" height="14" rx="7" fill="'+ac+'" opacity=".45"/>';});
    svg+='<rect x="38" y="275" width="190" height="14" rx="7" fill="'+ac+'" opacity=".25"/>';
  }else{
    [[30,60],[91,100],[152,150]].forEach(function(b){svg+='<rect x="'+b[0]+'" y="'+(320-b[1])+'" width="38" height="'+b[1]+'" rx="5" fill="'+ac+'" opacity=".55"/>';});
    svg+='<path d="M28 296 L90 240 L148 214 L232 136" stroke="'+ac+'" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M206 132 L238 130 L226 160 Z" fill="'+ac+'"/>';
  }
  document.getElementById('ill').innerHTML=svg;
  document.fonts.ready.then(function(){document.title='ready';});
</script>
</body>
</html>
